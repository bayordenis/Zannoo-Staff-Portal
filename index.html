<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zannoo International School Portal</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#1c2430;--muted:#5d6b7c;--line:#d8dee6;--brand:#1f5f8b;--brand2:#e08a2c;--nav:#10161f;--navink:#f1f5f9;--head:#2c3b4d;--okbg:#e3f3e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--surface:#171e27;--ink:#e8edf3;--muted:#9aa8b8;--line:#2a3441;--brand:#5aa6d6;--head:#2a3646;--okbg:#17352a}}
:root[data-theme="dark"]{--bg:#0e1319;--surface:#171e27;--ink:#e8edf3;--muted:#9aa8b8;--line:#2a3441;--brand:#5aa6d6;--head:#2a3646;--okbg:#17352a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,system-ui,sans-serif}
header{background:var(--hdr);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{background:var(--brand2);padding:6px 12px;border-radius:6px;font-weight:700;white-space:nowrap}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.3px}
.user{font-size:13px;white-space:nowrap}
button,select,input{font:inherit}
.iconbtn{background:none;border:0;color:inherit;cursor:pointer;font-size:18px}
nav{background:var(--nav);display:flex;overflow-x:auto;position:relative}
nav .item{position:relative}
nav .top{background:none;border:0;color:var(--navink);padding:10px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
nav .top:focus-visible,nav .sub button:focus-visible{outline:2px solid var(--brand2);outline-offset:-2px}
nav .top span{font-size:18px}
nav .item.open .top{background:#1b2431}
.sub{display:none;position:fixed;background:#1b2431;min-width:210px;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.item.open .sub{display:block}
.sub button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--navink);padding:11px 16px;cursor:pointer}
.sub button:hover{background:#26324a}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card h2{margin:0;padding:10px 16px;background:var(--hdr);color:#fff;font-size:16px;font-weight:500}
.card .body{padding:8px 16px 16px;overflow-x:auto}
.stat{display:flex;justify-content:space-between;padding:12px 0 8px;border-bottom:3px solid var(--brand);font-weight:600}
.stat b{font-size:18px}
.stat span{color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{background:var(--head);color:#fff;text-align:left;padding:8px 10px;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
td.dept{color:var(--brand);font-weight:600}
tfoot td{background:var(--head);color:#fff;font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.btn.del{background:#b3372f}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.seg{display:inline-flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:4px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg button.on.ab{background:#b3372f;border-color:#b3372f}
#fab{position:fixed;right:12px;top:140px;background:var(--nav);color:#fff;border:0;border-radius:6px 0 0 6px;padding:10px;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--nav);color:#fff;padding:8px 16px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
#login{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(#7fb8dd 0,#cfe6f3 38%,#f4efe3 38%,#f4efe3 70%,#2f8f55 70%,#2f8f55 78%,#8fc6e6 78%)}
#login[hidden],#app[hidden]{display:none}
.ltop{background:linear-gradient(#2b2b2f,#0e0e10);border-bottom:3px solid var(--brand2);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 16px}
.ltop svg{flex:none}
.ltop b{font-size:17px;flex:1;min-width:200px;letter-spacing:.3px}
.ltop a{color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:10px 12px;cursor:pointer}
.ltop a.on{background:var(--brand2)}
.lwrap{flex:1;display:flex;justify-content:flex-end;align-items:flex-start;padding:0 8vw}
@media(max-width:760px){.lwrap{justify-content:center;padding:0 12px}}
.lcard{background:#fff;color:#1c2430;width:100%;max-width:290px;padding:18px 16px 20px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.lcard .crest{display:block;margin:0 auto 14px}
.lcard label{display:flex;border:1px solid #cfd6de;margin-top:12px}
.lcard label span{background:#eef0f3;padding:8px 10px;color:#555}
.lcard input{flex:1;min-width:0;border:0;background:#fff;color:#1c2430;padding:8px 10px;font-size:14px}
.lcard input:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.err{color:#b3372f;font-style:italic;font-size:13px;text-align:center;min-height:18px;margin:2px 0 0}
.lcard .signin{width:100%;margin-top:14px;padding:10px;border:0;color:#fff;background:linear-gradient(#444,#1c1c1f);font:16px Georgia,serif;cursor:pointer}
.forgot{display:block;margin:16px 0 0 auto;background:var(--brand2);color:#fff;border:0;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}
.hint{font-size:12px;color:#5d6b7c;margin:14px 0 0;text-align:center}
.outbtn{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:13px}
[hidden]{display:none!important}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;color:var(--muted);font-weight:600;text-transform:uppercase;cursor:pointer}
.tabs button.on{color:var(--brand);border-bottom-color:#e0457b}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.col{border:1px solid var(--line);border-radius:6px;padding:8px 16px 16px}
.col h3{color:var(--brand);text-align:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
.f{display:block;margin-top:12px;font-weight:600}.f i{color:#c0392b;font-style:normal}.f small{display:block;font-weight:400;color:var(--muted)}.f input:not([type=radio]),.f select{display:block;width:100%;margin-top:4px}
.counts{display:flex;gap:12px;margin-bottom:12px}.counts div{border:1px solid var(--line);padding:8px 18px;text-align:center}.counts b{display:block;font-size:22px}.counts span{color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px}@media(max-width:800px){.split{grid-template-columns:1fr}}
.elist{max-height:420px;overflow:auto;border:1px solid var(--line)}.elist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px;color:var(--brand);font-weight:600;cursor:pointer}.elist button.on{background:var(--bg)}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--brand2);color:#fff;font-weight:700;flex:none}.av.big{width:96px;height:96px;font-size:36px;border-radius:6px}
.prof{display:flex;gap:16px;flex-wrap:wrap}.prof table{flex:1;min-width:240px}.prof th{background:none;color:var(--muted);width:40%}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);overflow:auto;display:flex;justify-content:center}
.mbox{position:relative;background:#fff;color:#1c2430;width:100%;max-width:900px;min-height:100%;padding:12px 24px 32px}
.mbox h3{color:#2f7fb8;text-align:center;margin:8px 0 0;padding-bottom:8px;border-bottom:1px solid #e1e5ea;font-size:18px}
.mx{position:absolute;right:12px;top:6px;background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:#5d6b7c}
.minfo{text-align:center;padding:14px 0;border-bottom:1px solid #e1e5ea}.minfo i{display:block;font-weight:600;line-height:1.8;color:#000}
.mrow{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:start;margin:22px auto;max-width:720px}
.mrow>label{font-weight:700;text-align:right;padding-top:8px;color:#444}
@media(max-width:640px){.mrow{grid-template-columns:1fr;margin:14px 0}.mrow>label{text-align:left;padding:0}}
.mfield{display:flex;border:1px solid #cfd6de}
.mfield span{background:#eef0f3;padding:8px 12px;color:#555;display:flex;align-items:center}
.mfield input,.mfield select,.mfield textarea{flex:1;min-width:0;border:0;border-radius:0;background:#fff;color:#1c2430;padding:8px 10px;font-size:14px}
.mfield textarea{resize:vertical}

:root{--hdr:#0f6b4a;--hh:56px}
body.fh header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
body.fs nav{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:35}
body.side #app{display:grid;grid-template-columns:220px 1fr;align-items:start}
body.side header{grid-column:1/-1}
body.side nav{grid-column:1;flex-direction:column;overflow-y:auto;overflow-x:visible;height:calc(100vh - var(--hh))}
body.side main{grid-column:2;width:100%;max-width:none;margin:0}
body.side nav .item{width:100%}
body.side nav .top{flex-direction:row;gap:12px;width:100%;justify-content:flex-start;padding:12px 18px;font-size:14px}
#fab,#gear{position:fixed;right:0;z-index:45;background:var(--nav);color:#fff;border:0;border-radius:6px 0 0 6px;padding:10px 12px;cursor:pointer;font-size:18px}
#fab{top:140px}#gear{top:188px}
#sp{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:90vw;background:var(--surface);color:var(--ink);box-shadow:-4px 0 16px rgba(0,0,0,.3);z-index:55;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.sph{display:flex;justify-content:space-between;align-items:center;background:#1b2431;color:#fff;padding:12px 16px;font-weight:600}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.sw input{appearance:none;-webkit-appearance:none;width:42px;height:22px;border-radius:11px;background:#c5ccd3;position:relative;cursor:pointer;border:0;padding:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:#00a0c6}.sw input:checked::after{left:22px}
.sw input:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.spt{padding:8px 16px 0;margin:8px 0 0;font-weight:600;color:var(--muted)}
.swg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px}
.swg button{aspect-ratio:1;border:2px solid transparent;border-radius:6px;cursor:pointer}
.swg button.on{outline:3px solid var(--ink);outline-offset:2px}
.ph{width:90px;height:120px;border:1px dashed var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;border-radius:4px;color:var(--muted);font-size:36px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sm{display:inline-grid;width:36px;height:48px;font-size:18px}
.phw{margin-top:12px;font-weight:600}.phf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.phf .btn{display:inline-block;font-weight:400}
.av.big{height:128px}

/* Mobile and small-screen improvements */
html{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;min-width:0;overflow-x:hidden}
button,input,select,textarea{max-width:100%;touch-action:manipulation}
img,svg,video{max-width:100%;height:auto}
header{min-width:0;flex-wrap:wrap}
header h1{min-width:0;overflow-wrap:anywhere}
main{width:100%;min-width:0}
.card,.card .body,.grid,.cols,.split,.col{min-width:0}
.card .body{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{min-width:520px}
.toolbar>*{min-width:0}
.modal{padding:0;align-items:flex-start;-webkit-overflow-scrolling:touch}
.mbox{min-height:100dvh;padding:16px max(14px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.mfield{min-width:0}
.mfield input,.mfield select,.mfield textarea{width:100%;min-width:0}
.ltop{min-width:0}
.ltop b{overflow-wrap:anywhere}
.lcard{max-width:360px}
#sp{padding-bottom:env(safe-area-inset-bottom,0px)}
@media(max-width:760px){
  body.side #app{display:block}
  body.side nav{height:auto}
  header{gap:8px;padding:8px 12px}
  header .lg{width:34px!important;height:34px!important}
  header h1{font-size:15px;flex:1 1 130px}
  header .user{display:none}
  header .outbtn{padding:6px 8px;font-size:12px}
  nav{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  nav .item{flex:0 0 auto}
  nav .top{padding:9px 12px;min-height:58px}
  nav .sub{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:12px;min-width:0;width:auto;max-height:55dvh;overflow-y:auto;border:1px solid #3b4655;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.4);padding:6px}
  nav .sub button{padding:13px 14px;white-space:normal;font-size:15px}
  main{padding:12px}
  .grid,.cols,.split{grid-template-columns:minmax(0,1fr);gap:12px}
  .toolbar{display:grid;grid-template-columns:minmax(0,1fr);width:100%}
  .toolbar input,.toolbar select,.toolbar button{width:100%;min-height:42px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;padding:10px 12px;white-space:nowrap}
  .counts{flex-wrap:wrap}
  .counts div{flex:1 1 110px}
  .prof{min-width:0}
  .prof table{min-width:0;width:100%}
  .lwrap{padding:12px;align-items:flex-start}
  .lcard{max-width:420px;margin:0 auto}
  .ltop{gap:8px;padding:10px 12px}
  .ltop b{font-size:15px;min-width:0}
  .ltop a{padding:8px;font-size:12px}
  #fab,#gear{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:12px;border-radius:24px;width:44px;height:44px;display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.25)}
  #gear{right:64px}
  #sp{width:min(320px,92vw);max-width:92vw}
  .mbox{width:100%;max-width:none}
  .mrow{grid-template-columns:minmax(0,1fr);gap:5px}
  .mrow>label{text-align:left;padding:0}
  .mfield{width:100%}
  .mfield input,.mfield select,.mfield textarea{font-size:16px;min-height:42px}
  .mx{position:sticky;float:right;top:4px;right:0;z-index:2;background:#fff;border-radius:50%;width:40px;height:40px}
  .minfo{clear:both;overflow-wrap:anywhere}
  .signin{min-height:44px}
}
@media(max-width:380px){
  body{font-size:14px}
  main{padding:8px}
  header h1{font-size:14px}
  nav .top{padding:8px 9px;font-size:12px}
  nav .top span{font-size:16px}
  .lcard{padding:14px 12px}
  .ltop b{font-size:13px}
  .ltop a{font-size:11px;padding:7px 5px}
}
@media(hover:none){
  nav .sub button:hover{background:none}
  button,.btn,.signin,.forgot{-webkit-tap-highlight-color:transparent}
}

function crud(title,key,fields,extra){
var q="";
function draw(){
var list=db[key].filter(function(x){return JSON.stringify(x,function(k,v){return k.indexOf("photo")>-1?undefined:v}).toLowerCase().indexOf(q)>-1});
var h='<div class="toolbar"><input id="q" placeholder="Search" value="'+esc(q)+'">'+'<button class="btn" id="add">Add new</button></div>';
if(!list.length)h+='<div class="empty">Nothing here yet. Select Add new to create the first record.</div>';
else{h+='<table><thead><tr>'+fields.map(function(f){return'<th>'+f[1]+'</th>'}).join("")+'<th></th></tr></thead><tbody>';
list.forEach(function(x){h+='<tr>'+fields.map(function(f){return'<td>'+(f[2]==="photo"?thumb(x[f[0]]):esc(x[f[0]]||""))+'</td>'}).join("")+'<td><button class="btn del" data-del="'+x.id+'">Delete</button></td></tr>'});h+='</tbody></table>'}
view.innerHTML=card(title,h);
$("#q").oninput=function(e){q=e.target.value.toLowerCase();draw();var i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)};
$("#add").onclick=form;
view.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){if(!confirm("Delete this record?"))return;db[key]=db[key].filter(function(x){return x.id!=b.dataset.del});save();draw();toast("Deleted")}})}
function form(){
var h='<form id="f" onsubmit="return false" style="display:grid;gap:10px;max-width:420px">'+fields.map(function(f){
return f[2]==="photo"?photoField(f[0],f[1],""):f[2]?'<label>'+f[1]+'<br><select name="'+f[0]+'" style="width:100%">'+f[2].map(function(o){return'<option>'+o+'</option>'}).join("")+'</select></label>'
:'<label>'+f[1]+'<br><input name="'+f[0]+'" style="width:100%" required></label>'}).join("")+
'<div><button class="btn" id="ok">Save</button> <button class="btn ghost" id="no">Cancel</button></div></form>';
view.innerHTML=card("Add to "+title,h);bindPhotos(view);
$("#no").onclick=draw;
